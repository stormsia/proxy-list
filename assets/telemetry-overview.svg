<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .sub { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748b; }
      .badge-txt { font: 700 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #38bdf8; }
      .msg-title { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .msg-desc { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748b; }
      .pulse { animation: beacon 2s infinite ease-in-out; }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <rect width="840" height="410" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="5" fill="#38bdf8" class="pulse" />
    <text x="20" y="10" class="badge-txt">HYDRA POOL TELEMETRY • INITIALIZING</text>
    <text x="0" y="38" class="title">Live Node Fleet Metrics</text>
    <text x="792" y="10" text-anchor="end" class="sub">Updated: 2026-11-21 01:39 UTC</text>
    <text x="792" y="38" text-anchor="end" class="msg-title" fill="#38bdf8">STANDBY</text>
  </g>

  <line x1="24" y1="78" x2="816" y2="78" stroke="#1e293b" stroke-width="1" />

  <g transform="translate(24, 100)">
    <rect width="792" height="280" rx="12" fill="#0f172a" stroke="#1e293b" stroke-dasharray="4 4" />
    <circle cx="396" cy="110" r="28" fill="#1e293b" />
    <circle cx="396" cy="110" r="12" fill="#38bdf8" class="pulse" />
    <text x="396" y="170" text-anchor="middle" class="msg-title">Pool Synchronizing: Ingesting Node Fleet</text>
    <text x="396" y="196" text-anchor="middle" class="msg-desc">Validation and telemetry ingestion pipeline is actively syncing verified node states.</text>
    <text x="396" y="216" text-anchor="middle" class="msg-desc">Metrics refresh automatically upon subsequent verification cycles.</text>
  </g>
</svg>