name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "data/proxies.json"
      - "!web/public/proxies.json"
      - "!web/public/data/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Allocate 8 GB Heap to eliminate GC pauses (utilizing 16 GB runner RAM)
  NODE_OPTIONS: "--max-old-space-size=8192"
  # Maximize parallel I/O throughput across all 4 vCPUs
  UV_THREADPOOL_SIZE: 16

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      # 1. Shallow & Sparse Checkout (web and data only, minimal git overhead)
      - name: Checkout (Shallow & Sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            web
            data

      # 2. Early Exit on Cron: skips build in 2s if no data or code changes occurred
      - name: Check for updates (Cron early exit)
        id: check_changes
        if: github.event_name == 'schedule'
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git diff --quiet HEAD~1 HEAD -- ../data/proxies.json .; then
            echo "No data or code changes detected since last commit. Skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected, proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. Setup ultra-fast Bun runtime & package manager
      - name: Setup Bun
        if: steps.check_changes.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Zero-Install: Cache node_modules (0s install time on cache hit)
      - name: Cache node_modules
        if: steps.check_changes.outputs.skip != 'true'
        id: modules-cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('web/package-lock.json') }}

      # 5. Compiler Cache: Next.js build cache (.next/cache)
      - name: Restore Next.js cache
        if: steps.check_changes.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-

      # 6. Install dependencies (only if lockfile changed and cache missed)
      - name: Install dependencies
        if: steps.check_changes.outputs.skip != 'true' && steps.modules-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # 7. Fast pre-sync proxies.json via shell before build
      - name: Pre-sync proxies.json
        if: steps.check_changes.outputs.skip != 'true'
        run: |
          mkdir -p public/data
          cp -f ../data/proxies.json public/data/proxies.json
          cp -f ../data/proxies.json public/proxies.json

      # 8. Build Next.js on 4 vCPUs
      - name: Build Next.js
        if: steps.check_changes.outputs.skip != 'true'
        run: bun run build

      # 9. Upload Pages artifact
      - name: Upload Pages artifact
        if: steps.check_changes.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

      # 10. Direct single-job deployment to GitHub Pages (eliminates second VM spin-up)
      - name: Deploy to GitHub Pages
        if: steps.check_changes.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
