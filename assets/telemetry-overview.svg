<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="bar-http" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bar-socks5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bar-socks4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <clipPath id="prog-track-clip">
      <rect width="340.0" height="10" rx="5" />
    </clipPath>
    <style>
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; }
      .sub { font: 500 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748b; }
      .section-hdr { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; letter-spacing: 0.5px; }
      .metric-val { font: 700 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .metric-lbl { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .badge-txt { font: 700 10px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #10b981; letter-spacing: 0.5px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .pulse { animation: beacon 2s infinite ease-in-out; }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="840" height="410" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Header Section -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="5" fill="#10b981" class="pulse" />
    <text x="20" y="10" class="badge-txt">HYDRA POOL TELEMETRY • 24/7 ACTIVE</text>
    <text x="0" y="38" class="title">Live Node Fleet Metrics</text>
    <text x="792" y="10" text-anchor="end" class="sub">Updated: 2026-11-24 17:09 UTC</text>
    <text x="792" y="38" text-anchor="end" class="metric-val mono" fill="#38bdf8">916 <tspan font-size="12" fill="#64748b">VERIFIED NODES</tspan></text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="78" x2="816" y2="78" stroke="#1e293b" stroke-width="1" />

  <!-- Card 1: Protocols Distribution (Left Top) -->
  <g transform="translate(24, 96)">
    <rect width="384" height="136" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="16" y="24" class="section-hdr">PROTOCOLS SHARE</text>

    <!-- Seamless Clipped Multi-segment Bar -->
    <g transform="translate(16, 38)">
      <rect width="340.0" height="10" rx="5" fill="#1e293b" />
      <g clip-path="url(#prog-track-clip)">
        <rect x="0" width="166.3" height="10" fill="url(#bar-http)" />
        <rect x="166.3" width="173.7" height="10" fill="url(#bar-socks5)" />
        <rect x="340.0" width="0.0" height="10" fill="url(#bar-socks4)" />
      </g>
    </g>

    <!-- Legend -->
    <g transform="translate(16, 68)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" />
      <text x="16" y="10" class="metric-lbl">HTTP/S</text>
      <text x="16" y="28" class="metric-val mono">48.9% <tspan font-size="11" fill="#64748b">(448)</tspan></text>

      <circle cx="132" cy="6" r="4" fill="#c084fc" />
      <text x="142" y="10" class="metric-lbl">SOCKS5</text>
      <text x="142" y="28" class="metric-val mono">51.1% <tspan font-size="11" fill="#64748b">(468)</tspan></text>

      <circle cx="250" cy="6" r="4" fill="#fbbf24" />
      <text x="260" y="10" class="metric-lbl">SOCKS4</text>
      <text x="260" y="28" class="metric-val mono">0.0% <tspan font-size="11" fill="#64748b">(0)</tspan></text>
    </g>
  </g>

  <!-- Card 2: Anonymity & Security (Right Top) -->
  <g transform="translate(432, 96)">
    <rect width="384" height="136" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="16" y="24" class="section-hdr">ANONYMITY &amp; SECURITY</text>

    <!-- Elite Bar -->
    <text x="16" y="47" class="metric-lbl">Elite (L1)</text>
    <rect x="100" y="39" width="145.0" height="8" rx="4" fill="#1e293b" />
    <rect x="100" y="39" width="45.6" height="8" rx="4" fill="#10b981" />
    <text x="368" y="47" text-anchor="end" class="mono sub" fill="#e2e8f0">288 (31.4%)</text>

    <!-- Anonymous Bar -->
    <text x="16" y="69" class="metric-lbl">Anonymous</text>
    <rect x="100" y="61" width="145.0" height="8" rx="4" fill="#1e293b" />
    <rect x="100" y="61" width="93.1" height="8" rx="4" fill="#38bdf8" />
    <text x="368" y="69" text-anchor="end" class="mono sub" fill="#e2e8f0">588 (64.2%)</text>

    <!-- Transparent Bar -->
    <text x="16" y="91" class="metric-lbl">Transparent</text>
    <rect x="100" y="83" width="145.0" height="8" rx="4" fill="#1e293b" />
    <rect x="100" y="83" width="6.3" height="8" rx="4" fill="#f59e0b" />
    <text x="368" y="91" text-anchor="end" class="mono sub" fill="#e2e8f0">40 (4.4%)</text>

    <!-- HTTPS Connect Support -->
    <line x1="16" y1="103" x2="368" y2="103" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="122" class="metric-lbl">HTTPS CONNECT Support</text>
    <text x="368" y="122" text-anchor="end" class="metric-val mono" fill="#34d399">68.7% <tspan font-size="11" fill="#64748b">(629 nodes)</tspan></text>
  </g>

  <!-- Card 3: Latency RTT Tiers (Left Bottom) -->
  <g transform="translate(24, 248)">
    <rect width="384" height="136" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="16" y="24" class="section-hdr">ROUND-TRIP TIME (RTT) TIERS</text>

    <g transform="translate(16, 42)">
      <!-- Tier 1: < 2s -->
      <text x="0" y="14" class="metric-lbl">&lt; 2s (Fast)</text>
      <rect x="110" y="6" width="170" height="8" rx="4" fill="#1e293b" />
      <rect x="110" y="6" width="75.3" height="8" rx="4" fill="#10b981" />
      <text x="352" y="14" text-anchor="end" class="mono sub">406</text>

      <!-- Tier 2: 2s - 5s -->
      <text x="0" y="38" class="metric-lbl">2s - 5s (Normal)</text>
      <rect x="110" y="30" width="170" height="8" rx="4" fill="#1e293b" />
      <rect x="110" y="30" width="57.9" height="8" rx="4" fill="#38bdf8" />
      <text x="352" y="38" text-anchor="end" class="mono sub">312</text>

      <!-- Tier 3: 5s - 10s -->
      <text x="0" y="62" class="metric-lbl">5s - 10s (High)</text>
      <rect x="110" y="54" width="170" height="8" rx="4" fill="#1e293b" />
      <rect x="110" y="54" width="30.3" height="8" rx="4" fill="#f59e0b" />
      <text x="352" y="62" text-anchor="end" class="mono sub">163</text>

      <!-- Tier 4: > 10s -->
      <text x="0" y="86" class="metric-lbl">&gt; 10s (Queue)</text>
      <rect x="110" y="78" width="170" height="8" rx="4" fill="#1e293b" />
      <rect x="110" y="78" width="6.5" height="8" rx="4" fill="#ef4444" />
      <text x="352" y="86" text-anchor="end" class="mono sub">35</text>
    </g>
  </g>

  <!-- Card 4: Top Node Locations (Right Bottom) -->
  <g transform="translate(432, 248)">
    <rect width="384" height="136" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="16" y="24" class="section-hdr">TOP GEOGRAPHIC LOCATIONS</text>

    <g transform="translate(16, 42)">
      <g transform="translate(0, 0)">
        <text x="0" y="12" class="mono metric-val" font-size="12">US</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="60.0" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">124</text>
      </g>
      <g transform="translate(0, 26)">
        <text x="0" y="12" class="mono metric-val" font-size="12">TR</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="42.6" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">88</text>
      </g>
      <g transform="translate(0, 52)">
        <text x="0" y="12" class="mono metric-val" font-size="12">VN</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="35.3" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">73</text>
      </g>
      <g transform="translate(180, 0)">
        <text x="0" y="12" class="mono metric-val" font-size="12">CH</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="31.5" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">65</text>
      </g>
      <g transform="translate(180, 26)">
        <text x="0" y="12" class="mono metric-val" font-size="12">ZW</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="24.2" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">50</text>
      </g>
      <g transform="translate(180, 52)">
        <text x="0" y="12" class="mono metric-val" font-size="12">SG</text>
        <rect x="28" y="3" width="65" height="8" rx="4" fill="#1e293b" />
        <rect x="28" y="3" width="17.9" height="8" rx="4" fill="url(#bar-green)" />
        <text x="164" y="11" text-anchor="end" class="mono sub">37</text>
      </g>
    </g>
  </g>
</svg>